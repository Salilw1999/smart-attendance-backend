version: '3.3'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/attendance_db
      - MINIO_URL=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - API_PROTOCOL=${API_PROTOCOL:-http}
      - API_HOST=${API_HOST:-localhost}
      - API_PORT=${API_PORT:-8000}
      - API_PREFIX=${API_PREFIX:-/api}
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-attendance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9002:9000"   # S3-compatible API
      - "9090:9090"   # Web console (GUI)
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3005:80"
    environment:
      - API_PROTOCOL=${API_PROTOCOL:-http}
      - API_HOST=${API_HOST:-localhost}
      - API_PORT=${API_PORT:-8000}
      - API_PREFIX=${API_PREFIX:-/api}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
