---
apiVersion: v1
kind: Service
metadata:
  name: smart-backend-service
spec:
  type: LoadBalancer
  selector:
    app: smart-backend
  ports:
    - port: 8091
      targetPort: 8000
      nodePort: 30001

---
apiVersion: v1
kind: Service
metadata:
  name: smart-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: smart-frontend
  ports:
    - port: 3006
      targetPort: 80
      nodePort: 30006

